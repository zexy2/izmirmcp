[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "izmir-mcp"
dynamic = ["version"]
description = "Read-only MCP server for İzmir open city data: transit, buses, ferries, water, air, pharmacies."
keywords = ["mcp", "model-context-protocol", "izmir", "turkey", "open-data", "transit", "smart-city", "llm"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zexy2" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "sqlglot>=25,<28",
  "starlette>=0.37,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
izmir-mcp = "app.main:run"
izmir-mcp-stdio = "app.stdio:main"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.21,<5",
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
]

[project.urls]
Homepage = "https://github.com/zexy2/izmirmcp"
Documentation = "https://github.com/zexy2/izmirmcp#readme"
Changelog = "https://github.com/zexy2/izmirmcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/zexy2/izmirmcp/issues"
Source = "https://github.com/zexy2/izmirmcp"

[tool.hatch.version]
# Single source of truth: app/__init__.py. server.json and the Docker label
# are checked against it by tests/test_packaging.py.
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
# `app` already contains app/data; a force-include for the same files makes
# hatchling fail with "A second file is being added to the wheel archive".
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured 90.46% when the gate was added; keep a 2-point buffer.
fail_under = 88
