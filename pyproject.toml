[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "izmir-mcp"
version = "0.1.0"
description = "Remote MCP server for İzmir open city data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.scripts]
izmir-mcp = "app.main:run"
izmir-mcp-stdio = "app.stdio:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
# `app` already contains app/data; a force-include for the same files makes
# hatchling fail with "A second file is being added to the wheel archive".
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
