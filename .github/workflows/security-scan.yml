name: Security Scan

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Weekly Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --pull -t izmir-mcp:scan .
      - name: Trivy scan (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: izmir-mcp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
