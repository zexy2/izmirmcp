name: Security scan

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Weekly Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --pull -t izmir-mcp:scan .
      - name: Trivy scan (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: izmir-mcp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
