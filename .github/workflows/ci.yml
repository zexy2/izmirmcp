name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA; dependabot keeps the pins current.
jobs:
  lint:
    name: Lint (ruff + format + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy
      - name: Ruff
        run: ruff check app scripts tests
      - name: Ruff format
        run: ruff format --check app scripts tests
      - name: Mypy
        run: mypy app --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import check
        run: python -c "import app.mcp.registry, app.main, app.stdio"
      - name: Unit tests (offline)
        # Tool-surface stability is enforced by tests/test_tool_compatibility.py.
        run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: Protocol smoke (offline)
        run: python scripts/smoke_mcp.py --verbose
      - name: Start HTTP server and probe readiness
        run: |
          python -m app.main &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/status

  conformance:
    name: Official MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/conformance/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          (cd tests/conformance && npm ci --silent)
      - name: Conformance (pinned subset)
        run: python scripts/check_mcp_conformance.py --output "$RUNNER_TEMP/conformance"
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker build, healthz, scan, SBOM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t izmir-mcp:ci .
      - name: Run container and check healthz
        run: |
          docker run -d --name izmir-ci -e IZMIR_MCP_SKIP_GTFS_BUILD=1 -p 8000:8000 izmir-mcp:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          docker logs izmir-ci
          docker rm -f izmir-ci
      - name: Trivy scan (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: izmir-mcp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (syft)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: izmir-mcp:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: pip-audit against the lockfile
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict -r requirements.lock

  live:
    # Third-party city APIs are outside our control: this job reports but never
    # blocks merges. Unit, protocol and conformance jobs are the gate.
    name: Live upstream checks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      IZMIR_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live pytest
        continue-on-error: true
        run: python -m pytest -q tests/live
      - name: User acceptance flows (live)
        continue-on-error: true
        run: python scripts/live_mcp_uat.py --verbose
      - name: Live source smoke
        continue-on-error: true
        run: python scripts/smoke_live.py
