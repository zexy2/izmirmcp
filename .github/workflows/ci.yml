name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and live smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import and tool-surface check
        run: |
          python -c "import app.mcp.registry, app.main, app.stdio"
          python -c "from app.mcp.registry import DEFAULT_TOOL_NAMES as n; print(len(n), 'tools'); assert len(n) == 19"

      - name: Unit tests (offline)
        run: python -m pytest -q

      - name: Protocol smoke (offline)
        # Starts a real local server and drives the MCP wire protocol. No
        # third-party API is contacted, so this check is blocking.
        run: python scripts/smoke_mcp.py --verbose

      - name: Live source smoke
        # Third-party city APIs are outside our control; a red smoke is reported
        # but does not block merges, while unit and protocol tests do.
        continue-on-error: true
        run: python scripts/smoke_live.py

      - name: Start HTTP server and probe readiness
        run: |
          python -m app.main &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/status

  container:
    name: Build and run the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t izmir-mcp:ci .

      - name: Run container and check healthz
        run: |
          docker run -d --name izmir-ci -e IZMIR_MCP_SKIP_GTFS_BUILD=1 -p 8000:8000 izmir-mcp:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          docker logs izmir-ci
          docker rm -f izmir-ci
