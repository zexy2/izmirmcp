# Lint config lives here rather than in pyproject.toml so packaging edits and
# lint edits do not collide.
target-version = "py311"
line-length = 120
extend-exclude = [".data", "reports", "tests/conformance/node_modules"]

[lint]
# Correctness and security rules only; style churn is not worth a red CI.
# Pyflakes (F) is fully enabled; pyupgrade (UP) still has findings in the
# tree and stays off until that cleanup lands.
# S608 is ignored because SQL goes through app/core guarded_sql validation.
select = ["E9", "F", "B", "S"]
ignore = ["S101", "S311", "S608", "S110", "B008", "B905"]

[lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S310", "S603", "S607"]
